<!DOCTYPE html>
<html lang="ko" class="publication-loading">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Noa Park — Publications</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html.publication-loading body.page-pub > :not(#publication-loading-screen) { opacity: 0; visibility: hidden; pointer-events: none; }
        html:not(.publication-loading) body.page-pub > :not(#publication-loading-screen) { transition: opacity .2s ease; }
        #publication-loading-screen { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; gap: 1rem; text-align: center; background: #f4f6fb; color: #1e3a5f; font: 600 1rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #publication-loading-screen::before { content: ""; width: 2rem; height: 2rem; margin: 0 auto; border: 3px solid #dbe5f5; border-top-color: #2563eb; border-radius: 50%; animation: publication-spin .8s linear infinite; }
        html:not(.publication-loading) #publication-loading-screen { display: none; }
        @keyframes publication-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #publication-loading-screen::before { animation: none; } }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="inc/css/bootstrap.min.css">
    <script src="inc/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="inc/css/page.css">
    <link rel="stylesheet" href="inc/css/publication.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="page-pub">
    <div id="publication-loading-screen" role="status" aria-live="polite">Loading page...</div>
    <div id="navbar-placeholder"></div>

    <main class="pub-page">
        <header class="pub-page-header">
            <p class="pub-page-kicker">Research output</p>
            <h1 class="pub-page-title"><span>Peer-reviewed publications</span></h1>
            <p class="pub-page-desc" id="publication-count"></p>
        </header>

        <ul class="pub-list" id="publication-list"></ul>
    </main>
    

    <div id="footer-placeholder"></div>

    <script src="inc/content/publication-content.js"></script>
    <script src="inc/js/publication-render.js"></script>
    <script src="inc/js/common.js"></script>
    <script>
        function showPublicationWhenReady() {
            var loadingScreen = document.getElementById('publication-loading-screen');
            if (!window.PUBLICATION_CONTENT) {
                loadingScreen.textContent = 'Unable to load content. Please refresh the page.';
                return;
            }
            Promise.resolve(document.fonts ? document.fonts.ready : null).then(function () {
                document.documentElement.classList.remove('publication-loading');
            });
        }
        if (document.readyState === 'complete') showPublicationWhenReady();
        else window.addEventListener('load', showPublicationWhenReady);
    </script>
</body>
</html>
