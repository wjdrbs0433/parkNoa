<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Noa Park Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS / JS -->
    <link rel="stylesheet" href="inc/css/bootstrap.min.css">
    <script src="inc/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="inc/css/page.css">
    <link rel="stylesheet" href="inc/css/about.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="page-about">
    <div id="navbar-placeholder"></div>

    
    <!-- 상단 프로필 섹션 -->
    <div class="about-hero">
    <div class="row g-4 align-items-start">
        <!-- 왼쪽 사진 -->
        <div class="col-lg-4 d-flex justify-content-center">
            <div class="about-photo-frame">
                <img src="img/img02.png" alt="Profile photo" class="about-photo">
            </div>
        </div>

        <!-- 오른쪽 텍스트 -->
        <div class="col-lg-8">
            <!-- 이름 + 현재 포지션 -->
            <div class="about-header">
                <h1 class="about-name" id="about-hero-name"></h1>
                <p class="about-position" id="about-hero-position"></p>
                <p class="about-meta">
                    <span id="about-meta-department"></span>
                    <span class="about-univ" id="about-meta-prior"></span>
                </p>
            </div>

            <!-- 한 줄 연구 요약 — 내용은 inc/content/about-content.js -->
            <div class="about-highlight" id="about-highlight"></div>

            <!-- Biography — 내용은 inc/content/about-content.js -->
            <section class="about-bio">
                <h2 class="about-section-title" id="about-bio-title"></h2>
                <div id="about-bio-body"></div>
                <p class="about-links">
                    <a href="#" target="_blank" rel="noopener" class="about-link" id="about-scholar-link"></a>
                </p>
            </section>
        </div>
    </div>
</div>


    <!-- CV 2열 그리드 섹션 -->
    <section class="cv-grid">
        <div class="row g-4">
            <!-- Research Interests — 목록은 inc/content/about-content.js -->
            <div class="col-lg-6 col-md-12">
                <div class="cv-card">
                    <h5 id="cv-research-title"></h5>
                    <div id="cv-research-list"></div>
                </div>
            </div>

            <!-- Education — inc/content/about-content.js -->
            <div class="col-lg-6 col-md-12">
                <div class="cv-card">
                    <h5 id="cv-education-title"></h5>
                    <div id="cv-education-body"></div>
                </div>
            </div>

            <!-- Research experience — 내용 없으면 빈 줄(&nbsp;) 한 줄만 표시 -->
            <div class="col-lg-6 col-md-12" id="cv-col-research-exp">
                <div class="cv-card">
                    <h5 id="cv-research-exp-title"></h5>
                    <div id="cv-research-exp-body"></div>
                </div>
            </div>

            <!-- Peer Reviewer — inc/content/about-content.js -->
            <div class="col-lg-6 col-md-12">
                <div class="cv-card">
                    <h5 id="cv-peer-title"></h5>
                    <div id="cv-peer-body"></div>
                </div>
            </div>

            <!-- Leadership — inc/content/about-content.js -->
            <div class="col-lg-12 col-md-12">
                <div class="cv-card">
                    <h5 id="cv-leadership-title"></h5>
                    <div id="cv-leadership-body"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- 내용 수정: inc/content/about-content.js 만 편집 -->
    <script src="inc/content/about-content.js"></script>
    <script src="inc/js/about-render.js"></script>
    <script src="inc/js/common.js"></script>
</body>
</html>
