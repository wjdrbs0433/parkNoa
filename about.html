<!DOCTYPE html>
<html lang="ko" class="about-loading">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Noa Park Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html.about-loading body.page-about > :not(#about-loading-screen) { opacity: 0; visibility: hidden; pointer-events: none; }
        html:not(.about-loading) body.page-about > :not(#about-loading-screen) { transition: opacity .2s ease; }
        #about-loading-screen { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; gap: 1rem; text-align: center; background: #f4f6fb; color: #1e3a5f; font: 600 1rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #about-loading-screen::before { content: ""; width: 2rem; height: 2rem; margin: 0 auto; border: 3px solid #dbe5f5; border-top-color: #2563eb; border-radius: 50%; animation: about-spin .8s linear infinite; }
        html:not(.about-loading) #about-loading-screen { display: none; }
        @keyframes about-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #about-loading-screen::before { animation: none; } }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS / JS -->
    <link rel="stylesheet" href="inc/css/bootstrap.min.css">
    <script src="inc/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="inc/css/page.css">
    <link rel="stylesheet" href="inc/css/about.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="page-about">
    <div id="about-loading-screen" role="status" aria-live="polite">Loading page...</div>
    <div id="navbar-placeholder"></div>

    
    <!-- 상단 프로필 섹션 -->
    <div class="about-hero">
    <div class="row g-4 align-items-start">
        <!-- 왼쪽 사진 -->
        <div class="col-lg-4 d-flex justify-content-center">
            <div class="about-photo-frame">
                <img src="img/img02.png" alt="Profile photo" class="about-photo">
            </div>
        </div>

        <!-- 오른쪽 텍스트 -->
        <div class="col-lg-8">
            <!-- 이름 + 현재 포지션 -->
            <div class="about-header">
                <h1 class="about-name" id="about-hero-name"></h1>
                <p class="about-position" id="about-hero-position"></p>
                <p class="about-meta">
                    <span id="about-meta-department"></span>
                    <span class="about-univ" id="about-meta-prior"></span>
                </p>
            </div>

            <!-- 한 줄 연구 요약 — 내용은 inc/content/about-content.js -->
            <div class="about-highlight" id="about-highlight"></div>

            <!-- Biography — 내용은 inc/content/about-content.js -->
            <section class="about-bio">
                <h2 class="about-section-title" id="about-bio-title"></h2>
                <div id="about-bio-body"></div>
                <p class="about-links">
                    <a href="#" target="_blank" rel="noopener" class="about-link" id="about-scholar-link"></a>
                </p>
            </section>
        </div>
    </div>
</div>


    <!-- CV 그리드: Education 전체 너비 → Research / Peer → Leadership -->
    <section class="cv-grid">
        <div class="row g-4">
            <div class="col-12">
                <div class="cv-card cv-card--education-wide cv-card--ribbon">
                    <h5 id="cv-education-title"></h5>
                    <div id="cv-education-body"></div>
                </div>
            </div>

            <div class="col-lg-6 col-md-12">
                <div class="cv-card cv-card--half">
                    <h5 id="cv-research-title"></h5>
                    <div id="cv-research-list"></div>
                </div>
            </div>

            <div class="col-lg-6 col-md-12">
                <div class="cv-card cv-card--half">
                    <h5 id="cv-peer-title"></h5>
                    <div id="cv-peer-body"></div>
                </div>
            </div>

            <div class="col-12">
                <div class="cv-card cv-card--ribbon">
                    <h5 id="cv-leadership-title"></h5>
                    <div id="cv-leadership-body"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- content/site-content.xlsx에서 생성한 About 데이터를 표시합니다. -->
    <script src="inc/content/about-content.js"></script>
    <script src="inc/js/about-render.js"></script>
    <script src="inc/js/common.js"></script>
    <script>
        function showAboutWhenReady() {
            var loadingScreen = document.getElementById('about-loading-screen');
            if (!window.ABOUT_CONTENT) {
                loadingScreen.textContent = 'Unable to load content. Please refresh the page.';
                return;
            }
            Promise.resolve(document.fonts ? document.fonts.ready : null).then(function () {
                document.documentElement.classList.remove('about-loading');
            });
        }
        if (document.readyState === 'complete') showAboutWhenReady();
        else window.addEventListener('load', showAboutWhenReady);
    </script>
</body>
</html>
