<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Noa Park Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS / JS -->
    <link rel="stylesheet" href="inc/css/bootstrap.min.css">
    <script src="inc/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="inc/css/page.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body class="page-gallery">
    <div id="navbar-placeholder"></div>

    <!-- 상단 캐러셀 -->
    <div class="container gallery-page">
        <div id="galleryCarousel" class="carousel slide mb-5" data-bs-ride="carousel" data-bs-interval="5000">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="carousel-slide-wrapper">
                        <img src="img/gallery11_Feb_2025.png" class="carousel-slide-img" alt="Slide 1">
                    </div>
                    <div class="carousel-caption d-none d-md-block">
                        <p>Feb 2025</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="carousel-slide-wrapper">
                        <img src="img/gallery12_Feb_2025.png" class="carousel-slide-img" alt="Slide 2">
                    </div>
                    <div class="carousel-caption d-none d-md-block">
                        <p>Feb 2025</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="carousel-slide-wrapper">
                        <img src="img/gallery16_Feb_2025.png" class="carousel-slide-img" alt="Slide 3">
                    </div>
                    <div class="carousel-caption d-none d-md-block">
                        <p>Feb 2025</p>
                    </div>
                </div>
            </div>
            <!-- 심플한 화살표 버튼 -->
            <button class="carousel-control-prev simple-carousel-btn" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev">
                <i class="bi bi-chevron-left"></i>
            </button>
            <button class="carousel-control-next simple-carousel-btn" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>

        <!-- 썸네일 그리드: 목록은 inc/content/gallery-manifest.js (연도↓ 월↓ 같은 달은 번호↓) -->
        <section class="gallery-grid-section" aria-label="Gallery thumbnails">
            <h2 class="gallery-grid-heading">Gallery</h2>
            <p class="gallery-grid-lead">Click to view it larger</p>
            <div class="row g-3 g-lg-4" id="galleryGrid"></div>
        </section>
    </div>

    <!-- 이미지 모달 -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header-custom">
                    <h6 class="modal-title-custom mb-0" id="modalTitle">Image</h6>
                    <button type="button" class="btn-close-custom" data-bs-dismiss="modal" aria-label="Close">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div class="modal-body-custom">
                    <img id="modalImage" src="" alt="" class="img-fluid w-100">
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="inc/js/common.js"></script>
    <script src="inc/content/gallery-manifest.js"></script>
    <script src="inc/js/gallery-grid.js"></script>
    <script src="inc/js/gallery.js"></script>
</body>
</html>
