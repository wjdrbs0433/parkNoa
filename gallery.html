<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Noa Park — Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="inc/css/bootstrap.min.css">
    <script src="inc/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="inc/css/page.css">
    <link rel="stylesheet" href="inc/css/gallery.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="page-gallery">
    <div id="navbar-placeholder"></div>

    <main class="container gallery-page">
        <h1 class="visually-hidden">Photo gallery</h1>

        <div id="galleryCarousel" class="carousel slide gallery-featured" hidden aria-label="Featured photos">
            <div class="carousel-indicators"></div>
            <div class="carousel-inner"></div>
            <button class="carousel-control-prev simple-carousel-btn" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev" aria-label="Previous photo">
                <i class="bi bi-chevron-left" aria-hidden="true"></i>
            </button>
            <button class="carousel-control-next simple-carousel-btn" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next" aria-label="Next photo">
                <i class="bi bi-chevron-right" aria-hidden="true"></i>
            </button>
        </div>

        <nav class="gallery-years" aria-label="Photo years">
            <div class="gallery-years-label">Year</div>
            <div class="gallery-year-buttons" id="galleryYearFilters"></div>
        </nav>

        <section class="gallery-grid-section" aria-label="Gallery photos">
            <div class="gallery-section-heading">
                <div>
                    <p class="gallery-section-kicker">Selected year</p>
                    <h2 class="gallery-grid-heading" id="galleryYearHeading"></h2>
                </div>
                <p class="gallery-grid-lead" id="galleryYearCount"></p>
            </div>
            <div class="row g-3 g-lg-4" id="galleryGrid"></div>
            <p class="gallery-empty" id="galleryEmpty" hidden></p>
        </section>
    </main>

    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header-custom">
                    <h2 class="modal-title-custom mb-0" id="modalTitle">Photo</h2>
                    <button type="button" class="btn-close-custom" data-bs-dismiss="modal" aria-label="Close">
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="modal-body-custom">
                    <img id="modalImage" alt="" class="img-fluid w-100" decoding="async">
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="inc/js/common.js"></script>
    <script src="inc/content/gallery-manifest.js"></script>
    <script src="inc/js/gallery-grid.js"></script>
    <script src="inc/js/gallery.js"></script>
</body>
</html>
